# CI pipeline (spec §12.2): lint → build + all tests with coverage → Docker images.
name: ci

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans the whole history, not just the last commit

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Formatting (dotnet format)
        run: dotnet format --verify-no-changes --no-restore

  build-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build -c Release --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/PriceRadar.UnitTests -c Release --no-build
          --collect:"XPlat Code Coverage" --results-directory TestResults/unit
          --logger "trx;LogFileName=unit.trx"

      # Testcontainers starts a real SQL Server 2022 with the runner's Docker (spec §11.1, D-27).
      - name: Integration tests (Testcontainers SQL Server)
        run: >
          dotnet test tests/PriceRadar.IntegrationTests -c Release --no-build
          --collect:"XPlat Code Coverage" --results-directory TestResults/integration
          --logger "trx;LogFileName=integration.trx"

      - name: Coverage summary
        if: always()
        run: |
          dotnet tool restore
          dotnet tool run reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:TestResults/report \
            -reporttypes:"MarkdownSummaryGithub;Cobertura" -assemblyfilters:"-*Tests*;-*Seeder*"
          cat TestResults/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/PriceRadar.Api/Dockerfile
          push: false
          tags: priceradar-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/PriceRadar.Worker/Dockerfile
          push: false
          tags: priceradar-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
