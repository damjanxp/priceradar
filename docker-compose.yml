# Local stack (spec §12.1). DAY-1 runs only `sql`; api and worker services are added on DAY-3.
name: priceradar

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: priceradar-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (copy .env.example)}
      MSSQL_PID: Developer
    ports:
      - "14333:1433"
    volumes:
      - sqldata:/var/opt/mssql
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  sqldata:
